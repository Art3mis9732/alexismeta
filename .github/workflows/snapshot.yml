name: market-snapshot
# Every 15 minutes: public Bitget data -> current read -> publish the site. No secrets.
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["docs/**", "scripts/**", "bgbot/**", ".github/workflows/snapshot.yml"]
permissions:
  contents: write
concurrency:
  group: snapshot
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q requests pandas numpy
      - run: python scripts/fetch_market.py
      - name: Carry over the published history test (if any) so the read can cite it
        run: |
          git fetch -q --depth=1 origin gh-pages || true
          git show origin/gh-pages:data/stats.json > docs/data/stats.json 2>/dev/null || rm -f docs/data/stats.json
      - run: node scripts/analyze.js
      - run: bash scripts/publish.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
