name: tests
on:
  push:
    branches: [main]
  pull_request: {}
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q -r requirements.txt
      - run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13"
      - run: node --disable-warning=ExperimentalWarning --test "tests_js/*.test.js"
